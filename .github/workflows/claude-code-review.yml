name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # The action exchanges the workflow's OIDC token for a GitHub App token, and that
    # exchange 401s unless `github.actor` itself has write access. A push by the Copilot
    # coding agent sets the actor to a bot that does not, so the review job fails on the
    # token exchange rather than on anything in the diff. Skip those revisions instead.
    if: ${{ github.actor != 'Copilot' && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /code-review:code-review --comment
