name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A green run takes about five minutes. The bound turns a hang into a red check instead of
    # an in_progress job that holds every merge until someone cancels it (issue #521).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - run: npm ci

      # verification: true
      - name: Run tests
        run: npm test

      # verification: true
      - name: Run S18.5 browser pass
        run: npm run test:browser

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # verification: true
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failures++
              foreach ($e in $parseErrors) {
                Write-Error "$($e.Message) at $($e.Extent.File):$($e.Extent.StartLineNumber)"
              }
            }
          }
          if ($failures -gt 0) { throw "$failures PowerShell file(s) failed to parse" }

      # verification: true
      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tools -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }
