name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - run: npm ci

      # Temporary — S28.1's tree-reachability probe (design/30-slices.md § S28),
      # captured on a real windows-latest runner. Removed once the finding is recorded.
      - name: S28.1 probe
        run: node harness/s28-tree-probe.mjs

      # verification: true
      - name: Run tests
        run: npm test

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # verification: true
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failures++
              foreach ($e in $parseErrors) {
                Write-Error "$($e.Message) at $($e.Extent.File):$($e.Extent.StartLineNumber)"
              }
            }
          }
          if ($failures -gt 0) { throw "$failures PowerShell file(s) failed to parse" }

      # verification: true
      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tools -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }

      # verification: true
      - name: Check design/10-design.md references resolve
        shell: pwsh
        run: |
          $result = ./tools/Test-DesignReferences.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-DesignReferences.ps1 exited $LASTEXITCODE" }
