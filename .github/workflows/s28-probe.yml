name: s28-tree-reachability-probe

# Temporary, manually-dispatched: gathers S28.1's empirical finding (design/30-slices.md
# § S28) on a real windows-latest runner, since this development environment has no
# Windows access. Removed once the finding is recorded (design/findings/S28-*.md).

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - run: node harness/s28-tree-probe.mjs
